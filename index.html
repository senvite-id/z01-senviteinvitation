<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Undangan Pernikahan</title>

  <!-- Google Font Handwritten Natural (Sangat mirip dengan tulisan tangan Canva) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    /* JIKA TETAP INGIN PAKAI FILE TTF MARYKATE MILIKMU SENDIRI */
    @font-face {
      font-family: 'MarykateLocal';
      src: url('multimedia/Marykate.ttf') format('truetype'),
           url('multimedia/Marykate.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #1a1a1a;
      overflow: hidden;
      font-family: 'MarykateLocal', 'Patrick Hand', 'Gloria Hallelujah', cursive, sans-serif;
    }

    /* CONTAINER UTAMA PAS LAYAR HP (RASIO 9:16) */
    .mobile-wrapper {
      max-width: 460px;
      height: 100%;
      margin: 0 auto;
      position: relative;
      background-color: #fbf7ee;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
    }

    /* 1. LAYER COVER */
    .cover-screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: url('multimedia/cover.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      z-index: 10;
      opacity: 1;
      transform: scale(1);
      transition: opacity 1.1s cubic-bezier(0.4, 0, 0.2, 1), transform 1.1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* AREA KONTEN BAWAH (NAMA TAMU & TOMBOL) */
    .bottom-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 14vh;
      padding: 0 20px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    /* NAMA TAMU (WARNA PINK #d06b7f) */
    .guest-name {
      font-family: 'MarykateLocal', 'Patrick Hand', 'Gloria Hallelujah', cursive, sans-serif;
      font-size: 1.65rem; /* Ukuran pas tulisan tangan */
      font-weight: 600;
      color: #d06b7f;
      letter-spacing: 0.5px;
      margin-top: 4px;
      margin-bottom: 12px;
      line-height: 1.2;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.7);
      max-width: 90%;
      word-break: break-word;
    }

    /* TOMBOL OPEN INVITATION (WARNA IJO #7b9a5e) */
    .btn-open {
      background-color: #7b9a5e;
      color: #ffffff;
      border: none;
      outline: none;
      font-family: 'MarykateLocal', 'Patrick Hand', 'Gloria Hallelujah', cursive, sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      padding: 8px 30px 9px 30px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(123, 154, 94, 0.35);
      transition: transform 0.2s ease, background-color 0.2s ease;
      letter-spacing: 0.5px;
    }

    .btn-open:hover, .btn-open:active {
      transform: scale(1.04);
      background-color: #6e8b53;
    }

    /* 2. LAYER VIDEO */
    .video-screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .video-screen video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* EFEK SAAT COVER DIBUKA */
    .cover-screen.hide {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    .cover-screen.hide .bottom-area {
      opacity: 0;
      transform: translateY(8px);
    }
  </style>
</head>
<body>

  <div class="mobile-wrapper">
    <!-- COVER DEPAN -->
    <div class="cover-screen" id="coverScreen">
      <div class="bottom-area">
        <!-- Nama tamu yang otomatis berubah via URL ?to=Nama+Tamu -->
        <h2 class="guest-name" id="guestName">Tamu Undangan</h2>

        <!-- Tombol Buka Undangan -->
        <button class="btn-open" id="btnOpen" type="button">
          Open Invitation
        </button>
      </div>
    </div>

    <!-- AREA VIDEO PLAYER -->
    <div class="video-screen">
      <video id="weddingVideo" src="multimedia/video.mp4" playsinline controls preload="metadata"></video>
    </div>
  </div>

  <script>
    // 1. Ambil nama tamu dari link URL parameter (?to=Nama+Tamu)
    const urlParams = new URLSearchParams(window.location.search);
    const guestParam = urlParams.get('to');
    if (guestParam) {
      document.getElementById('guestName').textContent = guestParam;
    }

    // 2. Klik Tombol Buka Undangan
    const btnOpen = document.getElementById('btnOpen');
    const coverScreen = document.getElementById('coverScreen');
    const weddingVideo = document.getElementById('weddingVideo');

    btnOpen.addEventListener('click', function () {
      coverScreen.classList.add('hide');
      if (weddingVideo) {
        weddingVideo.play().catch(function(error) {
          console.log("Autoplay:", error);
        });
      }
    });
  </script>
</body>
</html>
